name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: make gate

  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run python -m harness.arena --opponent baselines/random --games 2 --base-ms 5000

  # Ad-hoc: measure fastsearch18's real cold-start import time (Numba JIT
  # compile of negamax/quiescence/search_root) on a genuinely fresh Linux
  # runner -- the platform's actual deployment model (fresh container per
  # game), which this repo's Windows dev environment cannot reproduce.
  # Not wired to any promotion decision; purely a data-gathering run.
  cold-start-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync
      - run: uv run python tools/fresh_process_test.py --rounds 10

  # Same measurement, but for fastsearch30 (NNUE-integrated) specifically --
  # agent.py itself still imports fastsearch18, so the job above doesn't
  # exercise this candidate's own (larger) compiled body.
  cold-start-timing-nnue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync
      - run: |
          for i in 1 2 3; do
            uv run python -c "
          import time
          t0 = time.perf_counter()
          from deepblue.fastsearch30 import FastEngine30
          from deepblue.fastcore import from_fen
          t1 = time.perf_counter()
          engine = FastEngine30()
          engine.search(from_fen('r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1'), 40.0, 80.0, max_depth=1)
          t2 = time.perf_counter()
          print(f'round $i: import={t1-t0:.2f}s compile+search={t2-t1:.2f}s TOTAL={t2-t0:.2f}s')
          "
          done

  # Cold start for the current shipping candidates, on a fresh Linux runner --
  # the platform's own deployment model (new container per game) and the only
  # place this can be measured honestly. A Windows dev laptop reads fastsearch140
  # at 107s against a 90s budget, yet 140 plays real matches fine, so the laptop's
  # absolute numbers are useless; what matters is each build against 140 on
  # identical hardware.
  #
  # 140 is the reference: it is the build currently uploaded and known to start
  # in time. Any candidate materially slower than 140 here cannot be uploaded --
  # missing the 90s init budget loses every game in the match, which no amount of
  # playing strength repays.
  cold-start-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync
      - run: |
          for m in 140 162 170; do
            NUMBA_CACHE_DIR=$(mktemp -d) uv run python -c "
          import time, os
          t0 = time.perf_counter()
          import importlib
          mod = importlib.import_module('deepblue.fastsearch$m')
          t1 = time.perf_counter()
          mod.warm_up()
          t2 = time.perf_counter()
          budget = 90.0
          print(f'fastsearch$m  import={t1-t0:.1f}s  warm_up={t2-t1:.1f}s  TOTAL={t2-t0:.1f}s  of {budget:.0f}s budget')
          "
          done
